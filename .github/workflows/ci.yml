name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ""
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: tamara_saenz_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check / build
        run: npm run build

      # No hace falta declarar variables DB_*/JWT_*/etc. aquí: `test/jest.setup.ts` carga
      # `.env.test` (ya commiteado, con `DB_HOST=localhost`) con `override: true` antes de
      # que arranque cualquier test, y el runner de GitHub Actions accede al servicio
      # `mariadb` de arriba precisamente en `localhost:3306` (mapeo de puertos del job, no
      # una red Docker aparte) — el mismo archivo que ya usan los desarrolladores en local
      # funciona sin cambios en CI.
      - name: Tests de integración (contra MariaDB real del servicio)
        run: npm test
