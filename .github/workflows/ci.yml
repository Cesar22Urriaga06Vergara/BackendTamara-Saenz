name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      # MySQL 8 — el motor real de producción (Railway). El CI debe testear contra el
      # mismo dialecto que se despliega (ver plan BE-016).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: tamara_saenz_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Falla el CI si aparece una vulnerabilidad alta o crítica nueva. Nivel "high"
      # (no "moderate") para no bloquear por ruido de bajo impacto. Ver plan BE-014.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check / build
        run: npm run build

      # No hace falta declarar variables DB_*/JWT_*/etc. aquí: `test/jest.setup.ts` carga
      # `.env.test` (ya commiteado, con `DB_HOST=localhost`) con `override: true` antes de
      # que arranque cualquier test, y el runner de GitHub Actions accede al servicio
      # `mysql` de arriba precisamente en `localhost:3306` (mapeo de puertos del job, no
      # una red Docker aparte) — el mismo archivo que ya usan los desarrolladores en local
      # funciona sin cambios en CI.
      - name: Tests de integración (contra MySQL 8 real del servicio)
        run: npm test
